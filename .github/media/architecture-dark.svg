<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 446" width="440" height="446" role="img" aria-label="clickhouse-promql architecture. Grafana or any Prometheus client queries the adapter over the Prometheus HTTP API. The stateless Rust adapter parses PromQL, evaluates it, and deduplicates HA replicas, pushing series and time-range selection down to ClickHouse as SQL. ClickHouse holds the five default otel_metrics tables. The OpenTelemetry Collector's ClickHouse exporter writes those tables; the ingestion path is unchanged." style="font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="architecture-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4d4d8"/></marker>
  </defs>

  <rect x="90" y="14" width="260" height="38" rx="7" fill="#0c0c0e" stroke="#ffffff" stroke-width="1.3"/>
  <text x="220" y="37" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Grafana or any Prometheus client</text>
  <line x1="220" y1="52" x2="220" y2="85" stroke="#d4d4d8" stroke-width="1.3" marker-start="url(#architecture-arrow)" marker-end="url(#architecture-arrow)"/>
  <text x="228" y="72" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#d4d4d8">Prometheus HTTP API</text>

  <rect x="10" y="86" width="420" height="120" rx="10" fill="#161618" stroke="#d4d4d8" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="30" y="104" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.14em" fill="#d4d4d8">CLICKHOUSE-PROMQL ADAPTER</text>

  <rect x="30" y="116" width="380" height="74" rx="8" fill="#26262a" stroke="#ffffff" stroke-width="1.3"/>
  <text x="46" y="139" font-size="13" font-weight="600" fill="#ffffff">Rust query engine</text>
  <text x="394" y="138" text-anchor="end" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.12em" fill="#d4d4d8">STATELESS</text>
  <g fill="#0c0c0e" stroke="#ffffff" stroke-width="1.1">
    <rect x="46" y="150" width="81" height="28" rx="5"/>
    <rect x="135" y="150" width="81" height="28" rx="5"/>
    <rect x="224" y="150" width="81" height="28" rx="5"/>
    <rect x="313" y="150" width="81" height="28" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#ffffff">
    <text x="86.5" y="168">Parser</text>
    <text x="175.5" y="168">Evaluator</text>
    <text x="264.5" y="168">Histograms</text>
    <text x="353.5" y="168">HA dedup</text>
  </g>

  <line x1="220" y1="206" x2="220" y2="249" stroke="#d4d4d8" stroke-width="1.3" marker-start="url(#architecture-arrow)" marker-end="url(#architecture-arrow)"/>
  <text x="228" y="232" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#d4d4d8">SQL: series + time range</text>

  <rect x="10" y="250" width="420" height="88" rx="10" fill="#0c0c0e" stroke="#ffffff" stroke-width="1.3"/>
  <text x="26" y="273" font-size="13" font-weight="600" fill="#ffffff">ClickHouse</text>
  <text x="414" y="272" text-anchor="end" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.12em" fill="#d4d4d8">OTEL_METRICS_* TABLES</text>
  <g fill="#161618" stroke="#ffffff" stroke-width="1.1">
    <rect x="26" y="286" width="73" height="36" rx="5"/>
    <rect x="104" y="286" width="73" height="36" rx="5"/>
    <rect x="182" y="286" width="73" height="36" rx="5"/>
    <rect x="260" y="286" width="76" height="36" rx="5"/>
    <rect x="341" y="286" width="73" height="36" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#ffffff">
    <text x="62.5" y="308">gauge</text>
    <text x="140.5" y="308">sum</text>
    <text x="218.5" y="308">histogram</text>
    <text x="298" y="301">exponential</text>
    <text x="298" y="314">histogram</text>
    <text x="377.5" y="308">summary</text>
  </g>

  <text x="30" y="363" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.12em" fill="#d36945">INGESTION, UNCHANGED</text>
  <line x1="30" y1="368" x2="410" y2="368" stroke="#d36945" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="228" y="363" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#d4d4d8">writes</text>
  <line x1="220" y1="393" x2="220" y2="340" stroke="#d4d4d8" stroke-width="1.3" marker-end="url(#architecture-arrow)"/>

  <rect x="90" y="394" width="260" height="44" rx="7" fill="#0c0c0e" stroke="#ffffff" stroke-width="1.3"/>
  <text x="220" y="413" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">OpenTelemetry Collector</text>
  <text x="220" y="428" text-anchor="middle" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#d4d4d8">clickhouse exporter</text>
</svg>
