<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 192" width="680" height="192" role="img" aria-label="clickhouse-promql architecture. From left to right: Grafana or any Prometheus client sends PromQL over HTTP to the stateless clickhouse-promql adapter, which queries the otel_metrics tables in ClickHouse with SQL. Below ClickHouse, the OpenTelemetry Collector's ClickHouse exporter writes those tables; the ingestion path is unchanged." style="font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="architecture-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4d4d8"/></marker>
  </defs>

  <rect x="10" y="14" width="150" height="56" rx="7" fill="#0c0c0e" stroke="#ffffff" stroke-width="1.3"/>
  <text x="85" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Grafana</text>
  <text x="85" y="55" text-anchor="middle" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#d4d4d8">any Prometheus client</text>
  <line x1="160" y1="42" x2="229" y2="42" stroke="#d4d4d8" stroke-width="1.3" marker-start="url(#architecture-arrow)" marker-end="url(#architecture-arrow)"/>
  <text x="195" y="34" text-anchor="middle" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#d4d4d8">PromQL</text>

  <rect x="230" y="14" width="190" height="56" rx="10" fill="#26262a" stroke="#d4d4d8" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="325" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">clickhouse-promql</text>
  <text x="325" y="55" text-anchor="middle" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#d4d4d8">stateless Rust adapter</text>
  <line x1="420" y1="42" x2="479" y2="42" stroke="#d4d4d8" stroke-width="1.3" marker-start="url(#architecture-arrow)" marker-end="url(#architecture-arrow)"/>
  <text x="450" y="34" text-anchor="middle" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#d4d4d8">SQL</text>

  <rect x="480" y="14" width="190" height="56" rx="7" fill="#0c0c0e" stroke="#ffffff" stroke-width="1.3"/>
  <text x="575" y="38" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">ClickHouse</text>
  <text x="575" y="55" text-anchor="middle" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#d4d4d8">otel_metrics_* tables</text>

  <text x="30" y="103" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.12em" fill="#d36945">INGESTION, UNCHANGED</text>
  <line x1="30" y1="108" x2="650" y2="108" stroke="#d36945" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="583" y="103" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#d4d4d8">writes</text>
  <line x1="575" y1="133" x2="575" y2="72" stroke="#d4d4d8" stroke-width="1.3" marker-end="url(#architecture-arrow)"/>

  <rect x="480" y="134" width="190" height="48" rx="7" fill="#0c0c0e" stroke="#ffffff" stroke-width="1.3"/>
  <text x="575" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">OpenTelemetry Collector</text>
  <text x="575" y="170" text-anchor="middle" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#d4d4d8">clickhouse exporter</text>
</svg>
