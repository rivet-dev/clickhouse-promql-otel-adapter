receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: demo
          scrape_interval: 5s
          static_configs:
            - targets: ['host.docker.internal:18080']
exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    username: default
    password: local-test-only
    database: promql_demo
    create_schema: true
    async_insert: false
    sending_queue:
      enabled: false
service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [clickhouse]
