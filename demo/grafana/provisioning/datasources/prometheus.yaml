apiVersion: 1
datasources:
  - name: ClickHouse PromQL
    uid: clickhouse-promql
    type: prometheus
    access: proxy
    url: http://host.docker.internal:9091
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s
      prometheusType: Prometheus
      prometheusVersion: 3.15.0
